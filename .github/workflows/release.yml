name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  test:
    name: jMeter tests
    runs-on: ubuntu-latest
    env:
      JMETER_VERSION: 5.6.3
    services:
      megen:
        image: php:8.5-apache
        ports:
          - 80:80
        volumes:
          - ${{ github.workspace }}:/var/www/html/
    steps:
      - uses: actions/checkout@v7
      - name: Cache JMeter
        id: jmeter-cache
        uses: actions/cache@v6
        with:
          path: ~/jmeter
          key: jmeter-${{ env.JMETER_VERSION }}
      - name: Download JMeter
        if: steps.jmeter-cache.outputs.cache-hit != 'true'
        run: |
          FILE="apache-jmeter-${JMETER_VERSION}.tgz"
          curl -fsSL -o "/tmp/$FILE" "https://dlcdn.apache.org/jmeter/binaries/$FILE" \
            || curl -fsSL -o "/tmp/$FILE" "https://archive.apache.org/dist/jmeter/binaries/$FILE"
          mkdir -p ~/jmeter
          tar -xzf "/tmp/$FILE" -C ~/jmeter --strip-components=1
      - name: Run JMeter tests
        run: |
          echo "127.0.0.1 megen" | sudo tee -a /etc/hosts
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 -o /dev/null http://megen/
          export JAVA_HOME="$JAVA_HOME_17_X64" PATH="$JAVA_HOME_17_X64/bin:$PATH"
          ~/jmeter/bin/jmeter -n -t tests/all.jmx -l jmeter_log.log -j jmeter.log -e -o reports/
          jq -e '.Total.errorCount == 0' reports/statistics.json
          if grep -E ' ERROR ' jmeter.log; then exit 1; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jmeter-test-results
          path: |
            reports/
            jmeter.log

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Create GitHub release draft
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          draft: true

  docker-hub:
    name: Docker Hub
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Prepare
        id: prep
        run: |
          DOCKER_IMAGE=lszeremeta/megen
          VERSION=${GITHUB_REF#refs/tags/v}
          TAGS="${DOCKER_IMAGE}:${VERSION}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.prep.outputs.tags }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
      - name: Update repo description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASS }}
          repository: lszeremeta/megen

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Get latest code
        uses: actions/checkout@v7
      - name: Wait for concurrent jobs
        uses: softprops/turnstyle@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME_RELEASE }}
          password: ${{ secrets.FTP_PASSWORD_RELEASE }}
          protocol: ftps
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            .dockerignore
            logo/raw-svg
            logo/raw-svg/*
            logo/megen.png
            Dockerfile
            tests
            tests/*
            LICENSE
            README.md
